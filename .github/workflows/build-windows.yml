name: Build Windows preview

on:
  workflow_dispatch:
  workflow_call:
    secrets:
      HAISH_PAT:
        required: true
  push:
    branches: [feat/windows-client]

permissions:
  contents: read

jobs:
  windows-x64:
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      HAISH_RUNTIME_SOURCE: ${{ github.workspace }}/core-runtime
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: x64
      - uses: actions/checkout@v5
        with:
          repository: haishihua/haish-agent-core
          ref: 09ecf0ae893a9f54c10d01d08e070a618b95943b # Matched by prepare-windows-core.py
          path: core-runtime
          token: ${{ secrets.HAISH_PAT }}
          persist-credentials: false
      - run: npm ci
      - run: npm run typecheck
      - name: Build unsigned NSIS preview (includes local runtime smoke check)
        run: npm run dist:win
      - name: Smoke-check the bundled runtime (no installer or UI E2E)
        run: node scripts/smoke-runtime.mjs release/win-unpacked/resources/haish-agent-core/bin/haish-runtime/haish-runtime.exe build/runtime/packaged-smoke.log
      - name: Capture packaged Windows window
        run: ./scripts/capture-windows-preview.ps1
      - name: Upload Windows window screenshot
        uses: actions/upload-artifact@v4
        with:
          name: Haish-windows-window
          path: build/runtime/windows-preview.png
          if-no-files-found: error
      - name: Verify Windows update metadata
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          foreach ($file in @("Haish-$version-win-x64-setup.exe", "Haish-$version-win-x64-setup.exe.blockmap", "latest.yml")) {
            if (!(Test-Path "release/$file" -PathType Leaf) -or (Get-Item "release/$file").Length -eq 0) { throw "Missing update asset: $file" }
          }
      - name: Upload Windows installer and update assets to this run only
        uses: actions/upload-artifact@v4
        with:
          name: Haish-windows-x64-preview
          path: |
            release/Haish-*-win-x64-setup.exe
            release/Haish-*-win-x64-setup.exe.blockmap
            release/latest.yml
          if-no-files-found: error
      - name: Upload runtime diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Haish-windows-runtime-log
          path: build/runtime/*-smoke.log
          if-no-files-found: ignore
