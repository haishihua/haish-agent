name: Release macOS

# Manual macOS release build on a GitHub-hosted runner.
#
# Why CI: the app icon is an Icon Composer bundle (build/Haish.icon) that needs
# full Xcode 26+ (actool) to compile, and scripts/release-mac.mjs hard-gates on
# that. The `macos-26` runner label maps to the arm64 image with Xcode 26, which
# matches the published Haish-<version>-arm64.* artifacts. No Developer ID
# certificate exists here either, so the unsigned channel is used.
#
# One-time setup:
#   * Repository secret HAISH_PAT - a fine-grained personal access token with
#     read-only "Contents" permission on the private repositories
#       - haishihua/haish-agent-core    (Python runtime source)
#       - haishihua/haish-agent-remote  (remote adapter release assets)
#     The release itself is published with the workflow's own GITHUB_TOKEN.
#   * Commit the target version in package.json before dispatching.
#
# Publish or replace: scripts/release-mac.mjs creates the release for the
# package.json version, or replaces its assets when the release already exists.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build only (no release upload) — pipeline validation"
        type: boolean
        default: false
      runtime_ref:
        description: "Exact core commit SHA for reproducible builds"
        type: string
        required: true
        default: "49fca338c50f0d68716f7999b2ab65ca68dca533"

permissions:
  contents: write

concurrency:
  group: release-macos
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish unsigned arm64 build
    runs-on: macos-26
    timeout-minutes: 120
    env:
      # The runtime is built from a checkout of the private core repository,
      # cloned into ./core-runtime by the checkout step below.
      HAISH_RUNTIME_SOURCE: ${{ github.workspace }}/core-runtime
      # Keep electron-builder from probing the keychain for identities.
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      # Only the hybrid icon catalog is compiled by 26.0.1. Newer actool can
      # embed new-design legacy renditions which override our original ICNS.
      HAISH_ICON_DEVELOPER_DIR: /Applications/Xcode_26.0.1.app/Contents/Developer
    steps:
      - name: Check out the app
        uses: actions/checkout@v5

      - name: Show the toolchain
        run: |
          uname -m
          sw_vers
          xcode-select -p
          xcodebuild -version
          test -d "$HAISH_ICON_DEVELOPER_DIR" || { echo 'Hybrid icon compiler Xcode 26.0.1 is missing'; exit 1; }
          DEVELOPER_DIR="$HAISH_ICON_DEVELOPER_DIR" xcrun actool --version

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Verify the macOS icon toolchain
        run: npm run check:mac-icon

      - name: Install dependencies
        run: npm ci

      - name: Validate release gates and source pin
        env:
          RUNTIME_REF: ${{ inputs.runtime_ref }}
        run: |
          [[ "$RUNTIME_REF" =~ ^[0-9a-f]{40}$ ]] || { echo 'runtime_ref must be an exact commit SHA'; exit 1; }
          python3 -m venv build/release-check-venv
          build/release-check-venv/bin/python -m pip install packaging==26.3
          PATH="$PWD/build/release-check-venv/bin:$PATH" npm run test:release
          npm run typecheck

      - name: Check out the private runtime source
        uses: actions/checkout@v5
        with:
          repository: haishihua/haish-agent-core
          ref: ${{ inputs.runtime_ref }}
          path: core-runtime
          token: ${{ secrets.HAISH_PAT }}

      - name: Record runtime source
        env:
          RUNTIME_REF: ${{ inputs.runtime_ref }}
        run: |
          actual="$(git -C core-runtime rev-parse HEAD)"
          test "$actual" = "$RUNTIME_REF"
          echo "Runtime source: $actual" >> "$GITHUB_STEP_SUMMARY"

      - name: Fetch the pinned remote adapter
        env:
          GH_TOKEN: ${{ secrets.HAISH_PAT }}
        run: npm run fetch:remote-adapter

      - name: Build and publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          args=(--unsigned)
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            args+=(--dry-run)
          fi
          node scripts/release-mac.mjs "${args[@]}"

      - name: List the built artifacts (dry run)
        if: ${{ inputs.dry_run }}
        run: |
          ls -lh release/ release/mac-arm64/ | head -40
          runtime="release/mac-arm64/Haish.app/Contents/Resources/haish-agent-core/bin/haish-runtime/_internal"
          echo "=== packaged runtime deps (sample) ==="
          ls "$runtime" | grep -iE '^(yaml|pillow|PIL|certifi|qdrant_client)$' || echo 'no expected dep dirs found'
          echo "=== bundled resources ==="
          ls -lh release/mac-arm64/Haish.app/Contents/Resources/ | head -20

      - name: Preserve diagnostics and build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-release-${{ github.run_id }}
          if-no-files-found: ignore
          path: |
            build/runtime/*-smoke.log
            build/runtime/pyinstaller-work/haish-runtime/warn-haish-runtime.txt
            release/Haish-*.dmg
            release/Haish-*.zip
            release/latest-mac.yml

      - name: Summarize the release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="$(node -p "require('./package.json').version")"
          {
            echo "## Haish ${version} — macOS arm64, unsigned"
            echo
            gh release view "v${version}" --json url,isDraft,isPrerelease,assets \
              --jq '"URL: \(.url)\nDraft: \(.isDraft)  Prerelease: \(.isPrerelease)\n" + (.assets | map("- \(.name) — \(.size) bytes") | join("\n"))'
            echo
            echo "### latest-mac.yml"
            echo '```yaml'
            cat release/latest-mac.yml
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
