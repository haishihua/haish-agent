<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>App update footer — quiet hint vs update entry</title>
<style>
  html, body { margin: 0; background: #070b12; color: #e7ecf6; font: 13px system-ui; }
  h1 { font-size: 14px; margin: 10px 12px 6px; }
  .stacks { display: flex; flex-wrap: wrap; gap: 12px; padding: 0 12px 12px; }
  /* 左栏那份底色 + 底部对齐：弱提示与入口在真实位置上验（footer 自己是 margin: auto 10px 10px） */
  .sidebar {
    display: flex;
    flex-direction: column;
    width: 300px;
    height: 132px;
    padding: 10px 0 0;
    border: 1px solid rgba(176, 206, 255, 0.14);
    border-radius: 10px;
    background: #0b1018;
  }
  .sidebar-label { padding: 0 10px; font: 11px/1.6 ui-monospace, monospace; color: #7f8ea8; }
  #checks { margin: 0 12px 16px; padding: 10px; background: #0b0e14; color: #9fd8a4; white-space: pre-wrap; font: 11px/1.5 ui-monospace, monospace; border-radius: 8px; }
  #checks[data-result='FAIL'] { color: #ff8b9d; }
</style>
<h1>App update footer — 装好之后是弱提示，不是最新版本才长出入口</h1>
<div id="stacks" class="stacks"></div>
<pre id="checks" role="status">Running…</pre>
<script type="module" src="./app-update-footer.jsx"></script>
</html>
