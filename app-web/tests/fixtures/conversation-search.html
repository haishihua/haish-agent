<!doctype html>
<meta charset="utf-8">
<title>Conversation search regression</title>
<link rel="stylesheet" href="../../styles/chat.css">
<style>
  body { background: #101827; color: #dfe6f1; font: 18px sans-serif; padding: 32px; --conversation-font: sans-serif; }
  #messages { height: 240px; overflow: auto; margin-top: 20px; }
  .message-speech-body { border: 1px solid #334155; border-radius: 16px; padding: 16px; }
  .spacer { height: 350px; }
</style>
<h2 id="result">Running checks…</h2>
<button class="haish-search-match-preview" id="candidate">Jump to second <mark>211</mark> match</button>
<div id="messages">
  <div class="message-speech-body chat-bubble-text">需求 id=<strong>21</strong>1，第一次命中。
    <div class="spacer"></div>
    第二次 211，正文中的关键词。<button>211 hidden control</button><span aria-hidden="true">211 hidden</span>
    Literal a.b and axb. DRAFT draft.
    <div class="spacer"></div>
  </div>
  <div class="chat-timeline-text-body">过程中的 211</div>
</div>
<script type="module">
  import { collectConversationMatches, conversationMatchPositions, scrollToConversationMatch } from '../../src/features/chat/model/conversation-search.js';
  const container = document.querySelector('#messages');
  const assert = (value, label) => { if (!value) throw new Error(label); };
  try {
    const hits = collectConversationMatches(container, '211');
    assert(hits.length === 2, 'Repeated matches in message bodies, hidden control filtered');
    assert(hits.every(hit => hit.range.toString() === '211'), 'Range matches across inline markup');
    // 执行步骤/工具输出不参与搜索：`.chat-timeline-text-body` 里的同一个词不计入命中。
    assert(collectConversationMatches(container, '过程中的').length === 0, 'Execution steps stay out of search');
    assert(collectConversationMatches(container, 'a.b').length === 1, 'Literal regex escaping');
    assert(collectConversationMatches(container, 'draft').length === 2, 'Case insensitive');
    assert(collectConversationMatches(container, ' ').length === 0, 'Empty query');
    const positions = conversationMatchPositions(container, hits);
    assert(positions.every((position) => position >= 0 && position <= 100), 'Markers stay inside the track');
    assert(positions[0] < positions[1], 'Positions distinguish hits within one long message');
    CSS.highlights.set('conversation-matches', new Highlight(...hits.map(hit => hit.range)));
    document.querySelector('#candidate').onclick = () => scrollToConversationMatch(container, hits[1].range);
    document.querySelector('#candidate').click();
    assert(container.scrollTop > 0, 'Candidate scrolls within the same message');
    const hitRect = hits[1].range.getBoundingClientRect();
    const viewport = container.getBoundingClientRect();
    assert(hitRect.top >= viewport.top && hitRect.bottom <= viewport.bottom, 'Exact keyword visible');
    const scrolledPositions = conversationMatchPositions(container, hits);
    assert(scrolledPositions.every((position, index) => Math.abs(position - positions[index]) < 0.01), 'Scrolling does not move content-relative markers');
    const spacer = container.querySelector('.spacer');
    spacer.style.height = '700px';
    const resizedPositions = conversationMatchPositions(container, hits);
    assert(resizedPositions[1] > positions[1], 'Layout changes update keyword positions');
    spacer.style.height = '';
    // 删掉步骤块不影响命中/标记：搜索本来就只看消息正文（工具卡/步骤内容不在扫描范围）。
    const removed = container.lastElementChild;
    removed.remove();
    assert(conversationMatchPositions(container, hits).every((position) => position !== null), 'Removing an execution step leaves the markers alone');
    assert(collectConversationMatches(container, '211').length === 2, 'Removing an execution step changes no hit');
    container.append(removed);
    document.querySelector('#result').textContent = 'PASS — keyword ranges, navigation and scrollbar positions';
  } catch (error) {
    document.querySelector('#result').textContent = `FAIL — ${error.message}`;
    throw error;
  }
</script>
