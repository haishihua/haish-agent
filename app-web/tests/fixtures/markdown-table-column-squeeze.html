<!doctype html>
<html lang="en">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Markdown tables — 第一列只写实现名时不能折成一列字母</title>
  <style>
    html,
    body {
      margin: 0;
      background: #0a0f18;
      color: #e7ecf6;
      font: 13px system-ui;
    }
    h1 {
      font-size: 14px;
      margin: 10px 12px 6px;
    }
    /* styles/base.css 给应用外壳设了 `html, body { overflow: hidden; height: 100% }`，
       夹具页要能滚到底看报告，这里显式放开（几何断言只读测量值，不受影响）。 */
    html,
    body {
      overflow: auto !important;
      height: auto !important;
    }
    /* 宽度由脚本按 1750 / 1200 / 900px 改，模拟不同窗口下的消息列宽。 */
    #root {
      padding: 0 12px;
      width: 1750px;
    }
    #checks {
      margin: 12px;
      padding: 10px;
      background: #0b0e14;
      color: #9fd8a4;
      white-space: pre-wrap;
      font:
        11px/1.5 ui-monospace,
        monospace;
      border-radius: 8px;
    }
    #checks[data-result='FAIL'] {
      color: #ff8b9d;
    }
  </style>
  <h1>Markdown tables — 短英文列（pi / opencode / codex / Hermes）不能被压成一列字母</h1>
  <div id="root"></div>
  <pre id="checks" role="status">Running checks…</pre>
  <script type="module" src="./markdown-table-column-squeeze.jsx"></script>
</html>
