<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Workflow graph sync (config page writes, runtime renders)</title>
<style>
  html, body { margin: 0; background: #0a0f18; color: #e7ecf6; font: 13px system-ui; }
  h1 { font-size: 14px; margin: 10px 12px 6px; }
  .panes { display: flex; flex-direction: column; gap: 12px; padding: 0 12px; }
  .panes section { background: #0d1420; border: 1px solid rgba(176, 206, 255, 0.14); border-radius: 10px; overflow: hidden; }
  .panes h2 { margin: 0; padding: 6px 10px; font: 600 12px/1.4 ui-monospace, monospace; color: #9fb2cc; border-bottom: 1px solid rgba(176, 206, 255, 0.1); }
  .pane { height: 430px; width: 1180px; overflow: hidden; }
  #pane-config .settings-workbench { height: 430px; }
  /* 抽屉本来有三行（头/内容/脚），这里只放画布，让它占满一整行。 */
  #pane-config .settings-detail-drawer { grid-template-rows: minmax(0, 1fr); }
  #pane-runtime .workflow-run-layout { height: 430px; }
  /* 系统预设那两页：宽度故意不同（1180 vs 760）——过去列数按画布宽度算，排出来就是两张图。 */
  #pane-config-system { width: 1180px; height: 380px; }
  #pane-config-system .settings-workbench { height: 380px; }
  #pane-config-system .settings-detail-drawer { grid-template-rows: minmax(0, 1fr); }
  #pane-runtime-system { width: 760px; height: 380px; }
  #pane-runtime-system .workflow-run-layout { height: 380px; }
  #checks { margin: 12px; padding: 10px; background: #0b0e14; color: #9fd8a4; white-space: pre-wrap; font: 11px/1.5 ui-monospace, monospace; border-radius: 8px; }
  #checks[data-result='FAIL'] { color: #ff8b9d; }
</style>
<h1>Workflow graph sync — 配置页拖动写排布，运行页读同一份（运行页只读）</h1>
<div id="app"></div>
<pre id="checks" role="status">Running…</pre>
<script type="module" src="./workflow-graph-sync.jsx"></script>
</html>
